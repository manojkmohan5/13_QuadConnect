# CI for QuadConnect.
#
# One workflow with one job, triggered only by a push to feature/p1-a5 (the
# branch P1-A5 is built on), so every commit gets exactly one check:
# "Deploy / test (push)". Every CI step lives inside that job: install
# size, lint, Django checks, migrations, the committed database,
# constraints, the test suite, the production deploy checks, the
# production static build, and a smoke test of the production build.
#
# No matrix and no pull_request trigger on purpose: either would add checks.
# To run this on main after merging, change the branch below.

name: Deploy

on:
  push:
    branches: [feature/p1-a5]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # 3.12: the version the course's deployment target runs.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install size fits a 512 MB host
        # The course's host allows 512 MB for the virtualenv and the project
        # together, so the installed packages must leave room for the rest.
        run: |
          site="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          size="$(du -sm "$site" | cut -f1)"
          echo "Installed packages: ${size} MB"
          if [ "$size" -gt 400 ]; then
            echo "::error::Installed packages use ${size} MB; keep them under 400 MB."
            exit 1
          fi

      - name: Generate a throwaway secret key
        # Nothing in CI outlives the run, so a fresh random key per run is
        # safer than storing one. It is masked in the logs.
        run: |
          key="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "::add-mask::$key"
          echo "DJANGO_SECRET_KEY=$key" >> "$GITHUB_ENV"
          # Production settings refuse to start without a Google client; CI
          # never talks to Google, so a placeholder one is enough.
          echo "GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET=ci-placeholder" >> "$GITHUB_ENV"

      - name: Lint (ruff, rules in ruff.toml)
        run: |
          pip install ruff==0.16.4
          ruff check --output-format=github .

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: No model change without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Committed database is migrated and holds seed data only
        # db.sqlite3 is committed and deployed as-is. A locally used copy
        # would publish login sessions, leftover test venues, or the
        # password hash of someone's local superuser.
        run: |
          python manage.py migrate --check
          python manage.py shell -c "
          from django.contrib.admin.models import LogEntry
          from django.contrib.auth.models import User
          from django.contrib.sessions.models import Session
          from connect.models import CampusLocation
          problems = []
          if Session.objects.exists(): problems.append('login sessions')
          if LogEntry.objects.exists(): problems.append('admin history')
          if CampusLocation.objects.filter(is_approved=False).exists(): problems.append('unapproved venues')
          from allauth.account.models import EmailAddress
          from allauth.socialaccount.models import SocialAccount, SocialApp
          if SocialApp.objects.exists(): problems.append('a stored OAuth client (its secret belongs in .env)')
          if SocialAccount.objects.exists(): problems.append('Google accounts of people who signed in')
          if EmailAddress.objects.exists(): problems.append('email addresses of people who signed up')
          tester = User.objects.filter(username='tester', is_superuser=True).first()
          if not (tester and tester.check_password('uiuc12345')): problems.append('no working tester account')
          if any(u.has_usable_password() for u in User.objects.exclude(username__in=['tester', 'mohitg2'])): problems.append('password hashes of other accounts')
          if problems: raise SystemExit('Committed db.sqlite3 has: ' + ', '.join(problems) + '. Rebuild it.')
          print('Committed db.sqlite3: migrated, seed data only, tester account works.')
          "

      - name: Constraints and delete rules (verify_constraints)
        run: python manage.py verify_constraints

      - name: Test suite
        run: python manage.py test connect --verbosity 2

      - name: Production deploy checks (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: quadconnect.settings.production
          DJANGO_ALLOWED_HOSTS: quadconnect.example.edu
          DJANGO_SECURE_SSL: "1"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Build production static files (collectstatic)
        env:
          DJANGO_SETTINGS_MODULE: quadconnect.settings.production
          DJANGO_ALLOWED_HOSTS: 127.0.0.1
        run: python manage.py collectstatic --noinput

      - name: Boot the production build and smoke-test it
        env:
          DJANGO_SETTINGS_MODULE: quadconnect.settings.production
          DJANGO_ALLOWED_HOSTS: 127.0.0.1
          PORT: "8000"
        run: |
          python manage.py runserver "127.0.0.1:$PORT" --noreload > server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          base="http://127.0.0.1:$PORT"

          for _ in $(seq 1 30); do
            curl -fs -o /dev/null "$base/" && break
            sleep 1
          done
          if ! curl -fs -o /dev/null "$base/"; then
            echo "::error::The production server did not start."
            cat server.log
            exit 1
          fi

          jar=""  # no session yet: the first checks are signed out

          # expect <status> <content type> <path>, with the session in $jar if any
          expect() {
            got="$(curl -s ${jar:+-b "$jar"} -o /dev/null -w '%{http_code} %{content_type}' "$base$3" || true)"
            printf '%-36s %s\n' "$3" "$got"
            case "$got" in
              "$1 $2"*) ;;
              *)
                echo "::error::GET $3 returned '$got', expected '$1 $2'."
                cat server.log
                exit 1
                ;;
            esac
          }

          # P1-A5, signed out: only the landing page, the sign-in pages, the
          # privacy page and the public API open. Pages redirect to the login page; the other
          # APIs answer 401.
          expect 200 text/html        /
          expect 200 text/html        /accounts/login/
          expect 200 text/html        /accounts/signup/
          expect 200 text/html        /privacy/
          expect 200 text/html        /accounts/google/login/
          expect 200 text/html        /accounts/password/reset/
          expect 200 application/json /api/summary/
          expect 302 text/html        /admin/
          expect 302 text/html        /students/
          expect 302 text/html        /insights/
          expect 302 text/html        /reports/
          expect 302 text/html        /export/students.csv
          expect 302 text/html        /vega-lite/chart1.png
          expect 302 text/html        /api/
          expect 401 application/json /api/locations/
          expect 401 application/json /api/summary/matches-per-week/
          expect 401 application/json /api/icebreakers/

          # Sign in as the course's tester account, as a browser would.
          jar="$(mktemp)"
          token="$(curl -fs -c "$jar" "$base/accounts/login/" | grep -o 'name="csrfmiddlewaretoken" value="[^"]*"' | sed 's/.*value="//;s/"$//')"
          login="$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -c "$jar" -e "$base/accounts/login/" \
            --data-urlencode "csrfmiddlewaretoken=$token" --data-urlencode "login=tester" \
            --data-urlencode "password=uiuc12345" "$base/accounts/login/")"
          if [ "$login" != "302" ]; then
            echo "::error::Signing in as tester returned $login, expected a redirect."
            cat server.log
            exit 1
          fi

          # Signed in: every page of P1-A3 and P1-A4 opens.
          expect 200 text/html        /
          expect 200 text/html        /students/
          expect 200 text/html        /students/1/
          expect 200 text/html        /search/
          expect 200 text/html        "/search/?q=gaming"
          expect 200 text/html        /matches/
          expect 200 text/html        /matches/2/
          expect 200 text/html        /locations/
          expect 200 text/html        /locations/1/
          expect 200 text/html        /feedback/summary/
          expect 200 text/html        /insights/
          expect 200 image/png        /insights/students-by-college.png
          expect 200 image/png        /insights/interest-categories.png
          expect 200 text/html        /api/
          expect 200 application/json /api/locations/
          expect 200 application/json "/api/matches/?type=SQUAD"
          expect 400 application/json "/api/locations/?min_seats=many"
          expect 200 text/plain       /api/locations.txt
          expect 404 text/html        /no-such-page/
          expect 200 text/html        /admin/

          # P1-A4. The icebreakers API is only called on its error paths:
          # its success path depends on Open Trivia DB. The page answers 200
          # either way, and says so when Open Trivia DB fails.
          expect 200 application/json /api/summary/
          expect 200 application/json /api/summary/matches-per-week/
          expect 200 application/json /vega-lite/chart1.vl.json
          expect 200 image/png        /vega-lite/chart1.png
          expect 200 image/jpeg       /vega-lite/chart2.jpg
          expect 404 text/html        /vega-lite/chart9.png
          expect 400 application/json /api/icebreakers/
          expect 404 application/json "/api/icebreakers/?match=999"
          expect 200 text/html        /matches/2/icebreakers/
          expect 200 text/html        /reports/
          expect 200 text/csv         /export/students.csv
          expect 200 application/json /export/students.json

          # The four scripts the Insights page loads (Vega, Vega-Lite,
          # vega-embed and the chart code) must be hashed static files.
          scripts="$(curl -fs -b "$jar" "$base/insights/" | grep -o '/static/[^"]*\.[0-9a-f]\{12\}\.js' || true)"
          if [ "$(printf '%s\n' "$scripts" | grep -c .)" -ne 4 ]; then
            echo "::error::The Insights page does not load its four hashed scripts: $scripts"
            exit 1
          fi
          for js in $scripts; do
            expect 200 text/javascript "$js"
          done

          # Cache busting: the page must link a content-hashed stylesheet,
          # served with a far-future immutable cache header.
          css="$(curl -fs "$base/" | grep -o '/static/css/quadconnect\.[0-9a-f]\{12\}\.css' | head -n 1 || true)"
          if [ -z "$css" ]; then
            echo "::error::The home page does not link a content-hashed stylesheet."
            exit 1
          fi
          cache="$(curl -fsI "$base$css" | tr -d '\r' | grep -i '^cache-control:' || true)"
          echo "$css -> $cache"
          case "$cache" in
            *immutable*) ;;
            *)
              echo "::error::$css is not served with an immutable cache header."
              exit 1
              ;;
          esac
