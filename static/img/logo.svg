<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>QuadConnect</title>
  <!-- A Q whose bowl is a quad: a rounded square of lawn. Its tail is the
       path that crosses the corner, where two people meet. Illini orange
       and blue, flat, on its own tile, so the same file works in the
       header and as a favicon on a light or a dark tab. -->
  <rect width="32" height="32" rx="9" fill="#ff5f05"/>
  <rect x="8" y="7" width="15" height="15" rx="5" fill="none" stroke="#13294b" stroke-width="4.5"/>
  <path d="M17.5 16.5l7 7" stroke="#ff5f05" stroke-width="9" stroke-linecap="round"/>
  <path d="M17.5 16.5l7 7" stroke="#13294b" stroke-width="4.5" stroke-linecap="round"/>
</svg>
